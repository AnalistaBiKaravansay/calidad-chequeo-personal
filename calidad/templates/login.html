<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Calidad Karavansay</title>
  <link rel="icon" href="/static/logo.svg?v={{ V }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/estilo.css?v={{ V }}">
</head>
<body>
  <main class="entrar">
    <form method="post" action="/login" class="login">
      <img src="/static/logo.svg?v={{ V }}" alt="Karavansay" width="162" height="72">
      <h1>Calidad · Chequeo de personal</h1>
      <p class="nota">Información de salud del personal. Solo para el equipo de Calidad.</p>
      {% if error %}<div class="mensaje" role="alert">Clave incorrecta.</div>{% endif %}
      <input type="hidden" name="volver" value="{{ volver }}">
      <label>Clave <input type="password" name="clave" autofocus required autocomplete="current-password"></label>
      <button class="principal">Entrar</button>
    </form>
  </main>
</body>
</html>
