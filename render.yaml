# Configuración para Render (plan gratuito). Render la lee al crear el servicio desde el repositorio.
# Los valores secretos (sync: false) se escriben a mano en Render, nunca aquí.
services:
  - type: web
    name: calidad-chequeo-personal
    runtime: python
    plan: free
    region: virginia             # la misma zona que la base en Neon (AWS US East): consultas más rápidas
    buildCommand: pip install -r requirements.txt
    # Sin pytest en el servidor: instala menos y arranca antes. --proxy-headers: Render atiende por https.
    startCommand: uvicorn calidad.web:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CALIDAD_NUBE
        value: "1"
      - key: DATABASE_URL        # dirección de conexión de Neon
        sync: false
      - key: GEMINI_API_KEY      # clave de Gemini
        sync: false
      - key: CALIDAD_SECRETO     # firma las sesiones; Render lo inventa solo
        generateValue: true
      - key: CALIDAD_TOKEN_FLUJO # contraseña que Power Automate envía en el encabezado x-token; Render la inventa
        generateValue: true
